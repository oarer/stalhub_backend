services:
  app:
    build: .
    container_name: StalHub_backend
    command: sh -c "bun install && bun run --watch src/index.ts"
    # for proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      IMAGE_SERVICE_URL: http://image-service:3002
      NO_PROXY: localhost,127.0.0.1,::1,app,image-service,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,app,image-service,host.docker.internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      image-service:
        condition: service_started

  image-service:
    build: ./image-service
    container_name: StalHub_image_service
    command: sh -c "bun install && bun run --watch src/index.ts"
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./image-service:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      PORT: 3002

  discord-bot:
    build: ./discord-bot
    container_name: StalHub_discord_bot
    command: sh -c "bun install && bun run --watch src/index.ts"
    restart: unless-stopped
    volumes:
      - ./discord-bot:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:3001
      NO_PROXY: app,localhost,127.0.0.1
      no_proxy: app,localhost,127.0.0.1

  telegram-bot:
    build: ./telegram-bot
    container_name: StalHub_telegram_bot
    command: sh -c "bun install && bun run --watch src/index.ts"
    restart: unless-stopped
    volumes:
      - ./telegram-bot:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      BACKEND_URL: http://app:3001
      TG_POLLING_TIMEOUT_SECONDS: ${TG_POLLING_TIMEOUT_SECONDS:-30}
      TG_CACHE_TTL_SECONDS: ${TG_CACHE_TTL_SECONDS:-60}
      TG_RATE_LIMIT_PER_MINUTE: ${TG_RATE_LIMIT_PER_MINUTE:-10}
      TG_SEARCH_DEBOUNCE_MS: ${TG_SEARCH_DEBOUNCE_MS:-250}
      TG_REQUEST_TIMEOUT_MS: ${TG_REQUEST_TIMEOUT_MS:-4500}
      TG_WEBAPP_URL: ${TG_WEBAPP_URL:-https://stalhub.dev}
      TG_IMAGE_SERVICE_URL: http://image-service:3002
      NO_PROXY: app,localhost,127.0.0.1
      no_proxy: app,localhost,127.0.0.1
    depends_on:
      app:
        condition: service_started
      image-service:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: StalHub_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17.4-alpine
    container_name: StalHub_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  pg_data_dev:
