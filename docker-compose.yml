services:
  app:
    container_name: StalHub_backend
    build: .
    ports:
      - "8000:3001"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      IMAGE_SERVICE_URL: http://image-service:3002
      IMAGE_SERVICE_TIMEOUT_MS: 60000
      AUCTION_DATABASE_URL: ${AUCTION_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@auction-db:5432/auction}
      NO_PROXY: localhost,127.0.0.1,::1,app,image-service,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,app,image-service,host.docker.internal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      auction-db:
        condition: service_healthy
      image-service:
        condition: service_started
    command: [ "sh", "-c", "bun run db:deploy && ./server" ]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - ./uploads:/app/uploads
      - ./runtime:/app/runtime
      - ./scripts:/app/scripts:ro
      - ./auction-db:/app/auction-db

  image-service:
    build: ./image-service
    container_name: StalHub_image_service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 3s
      retries: 5

  discord-bot:
    build: ./discord-bot
    container_name: StalHub_discord_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:3001
      NO_PROXY: localhost,127.0.0.1,::1,app,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,app,host.docker.internal
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  telegram-bot:
    build: ./telegram-bot
    container_name: StalHub_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      BACKEND_URL: http://app:3001
      TG_POLLING_TIMEOUT_SECONDS: ${TG_POLLING_TIMEOUT_SECONDS:-30}
      TG_CACHE_TTL_SECONDS: ${TG_CACHE_TTL_SECONDS:-60}
      TG_RATE_LIMIT_PER_MINUTE: ${TG_RATE_LIMIT_PER_MINUTE:-10}
      TG_SEARCH_DEBOUNCE_MS: ${TG_SEARCH_DEBOUNCE_MS:-250}
      TG_WEBAPP_URL: ${TG_WEBAPP_URL:-https://stalhub.dev}
      NO_PROXY: localhost,127.0.0.1,::1,app,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,app,host.docker.internal
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: StalHub_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17.4-alpine
    container_name: StalHub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auction-db:
    image: timescale/timescaledb-ha:pg17
    container_name: StalHub_auction_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auction
    ports:
      - "5433:5432"
    volumes:
      - auction_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: StalHub_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus.yml:/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: StalHub_grafana
    restart: unless-stopped
    ports:
      - "3006:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SERVER_ROOT_URL: https://grafana.stalhub.dev
      GF_SERVER_DOMAIN: grafana.stalhub.dev
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: "lax"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: StalHub_node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"

volumes:
  redis_data:
  pg_data:
  auction_data:
  grafana_data:
