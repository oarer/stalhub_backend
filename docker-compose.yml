services:
  app:
    container_name: StalHub_backend
    build: .
    ports:
      - "8000:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NO_PROXY: localhost,127.0.0.1,::1,app,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,app,host.docker.internal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: [ "sh", "-c", "bun run db:deploy && ./server" ]
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 3s
      retries: 5

  discord-bot:
    build: ./discord-bot
    container_name: StalHub_discord_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:3001
      NO_PROXY: localhost,127.0.0.1,::1,app,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,app,host.docker.internal
    depends_on:
      app:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: StalHub_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17.4-alpine
    container_name: StalHub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: StalHub_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus.yml:/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: StalHub_grafana
    restart: unless-stopped
    ports:
      - "3006:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SERVER_ROOT_URL: https://grafana.stalhub.dev
      GF_SERVER_DOMAIN: grafana.stalhub.dev
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: "lax"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: StalHub_node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: StalHub_cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  redis_data:
  pg_data:
  grafana_data:
